name: krag_app
description: A secure, local-first knowledge base with Google Drive sync.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0

  # UI Components & Editor
  appflowy_editor: ^6.2.0 # Block-based editor replacement for Tiptap
  flutter_svg: ^2.0.10
  flex_color_picker: ^3.5.0
  google_fonts: ^6.2.1

  # Networking & Auth
  http: ^1.2.2
  google_sign_in: ^6.2.1
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13

  # Cryptography & Security
  cryptography: ^2.7.2

  # Storage & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utilities
  uuid: ^4.5.1
  archive: ^3.6.1 # For zip export
  url_launcher: ^6.3.1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.0.0
  envied: ^1.3.2
  markdown: ^7.3.0
  html: ^0.15.4
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  universal_html: ^2.3.0
  flutter_code_editor: ^0.3.5

  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  envied_generator: ^1.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/